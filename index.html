<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AniVerse — Anime Universe</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Inter, sans-serif;
    background: #08080d;
    color: #fff;
}

header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(8,8,13,.92);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid #20202a;
}

.navbar {
    max-width: 1200px;
    margin: auto;
    height: 75px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 25px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    color: white;
    text-decoration: none;
    font-size: 23px;
    font-weight: 800;
    white-space: nowrap;
}

.logo img {
    width: 45px;
    height: 45px;
    object-fit: cover;
    border-radius: 50%;
}

.logo span {
    color: #a855f7;
}

.nav-links {
    display: flex;
    gap: 25px;
}

.nav-links a {
    color: #aaa;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
}

.nav-links a:hover {
    color: white;
}

.search {
    flex: 1;
    max-width: 330px;
    position: relative;
}

.search input {
    width: 100%;
    padding: 12px 18px;
    border-radius: 25px;
    border: 1px solid #292936;
    background: #111119;
    color: white;
    outline: none;
}

.search input:focus {
    border-color: #8b5cf6;
}

.hero {
    max-width: 1200px;
    margin: auto;
    padding: 80px 20px 55px;
}

.hero-content {
    max-width: 700px;
}

.badge {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 20px;
    background: #181322;
    color: #c084fc;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 20px;
}

.hero h1 {
    font-size: clamp(42px, 7vw, 78px);
    line-height: 1;
    margin-bottom: 20px;
}

.hero h1 span {
    color: #a855f7;
}

.hero p {
    color: #999;
    font-size: 17px;
    line-height: 1.7;
    margin-bottom: 30px;
}

.hero-buttons {
    display: flex;
    gap: 12px;
}

.btn {
    padding: 13px 22px;
    border-radius: 9px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
}

.btn-primary {
    background: #8b5cf6;
    color: white;
}

.btn-primary:hover {
    background: #7c3aed;
}

.btn-secondary {
    border: 1px solid #30303c;
    color: white;
    background: #111119;
}

.section {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.section-title h2 {
    font-size: 24px;
}

.section-title span {
    color: #888;
    font-size: 13px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 18px;
}

.card {
    background: #111119;
    border: 1px solid #20202a;
    border-radius: 12px;
    overflow: hidden;
    transition: .25s;
}

.card:hover {
    transform: translateY(-6px);
    border-color: #8b5cf6;
}

.card img {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
}

.card-info {
    padding: 12px;
}

.card h3 {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card p {
    color: #888;
    font-size: 12px;
    margin-top: 7px;
}

.loading {
    text-align: center;
    padding: 50px;
    color: #888;
}

footer {
    margin-top: 80px;
    padding: 35px 20px;
    text-align: center;
    border-top: 1px solid #20202a;
    color: #666;
    font-size: 13px;
}

@media (max-width: 900px) {
    .grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .nav-links {
        display: none;
    }
}

@media (max-width: 600px) {
    .navbar {
        height: auto;
        padding: 15px;
        flex-wrap: wrap;
    }

    .search {
        order: 3;
        max-width: none;
        flex-basis: 100%;
    }

    .hero {
        padding-top: 50px;
    }

    .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .hero-buttons {
        flex-direction: column;
    }

    .btn {
        text-align: center;
    }
}
</style>
</head>

<body>

<header>
    <div class="navbar">

        <a class="logo" href="#">
            <img src="ChatGPT%20Image%20Aug%2016,%202026,%2005_38_10%20PM.png"
                 alt="AniVerse Logo">
            Ani<span>Verse</span>
        </a>

        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#trending">Trending</a>
            <a href="#anime">Anime</a>
        </nav>

        <div class="search">
            <input
                id="searchInput"
                type="text"
                placeholder="Search anime..."
                onkeyup="searchAnime()">
        </div>

    </div>
</header>

<section class="hero">

    <div class="hero-content">

        <div class="badge">✦ YOUR ANIME UNIVERSE</div>

        <h1>
            Discover Your<br>
            <span>Next Anime.</span>
        </h1>

        <p>
            Explore thousands of anime, discover trending shows,
            and find your next favorite adventure.
        </p>

        <div class="hero-buttons">
            <a class="btn btn-primary" href="#trending">
                Explore Anime
            </a>

            <a class="btn btn-secondary" href="#anime">
                Browse Library
            </a>
        </div>

    </div>

</section>

<section class="section" id="trending">

    <div class="section-title">
        <h2>🔥 Trending Anime</h2>
        <span>Popular right now</span>
    </div>

    <div id="animeGrid" class="grid">
        <div class="loading">Loading anime...</div>
    </div>

</section>

<footer>
    © 2026 AniVerse — Your Anime Universe
</footer>

<script>

const grid = document.getElementById("animeGrid");

async function loadAnime(url =
    "https://api.jikan.moe/v4/top/anime?limit=10"
) {

    grid.innerHTML =
        '<div class="loading">Loading anime...</div>';

    try {

        const response = await fetch(url);
        const data = await response.json();

        grid.innerHTML = "";

        data.data.forEach(anime => {

            const card = document.createElement("div");

            card.className = "card";

            card.innerHTML = `
                <img
                    src="${anime.images.jpg.large_image_url}"
                    alt="${anime.title}"
                    loading="lazy">

                <div class="card-info">

                    <h3>${anime.title}</h3>

                    <p>
                        ⭐ ${anime.score || "N/A"}
                        &nbsp; • &nbsp;
                        ${anime.type || "Anime"}
                    </p>

                </div>
            `;

            grid.appendChild(card);

        });

    } catch (error) {

        grid.innerHTML =
            '<div class="loading">Unable to load anime. Please refresh.</div>';

    }
}

let searchTimer;

function searchAnime() {

    clearTimeout(searchTimer);

    searchTimer = setTimeout(async () => {

        const query =
            document.getElementById("searchInput").value.trim();

        if (!query) {

            loadAnime();

            return;
        }

        loadAnime(
            "https://api.jikan.moe/v4/anime?q="
            + encodeURIComponent(query)
            + "&limit=10"
        );

    }, 500);
}

loadAnime();

</script>

</body>
</html>
